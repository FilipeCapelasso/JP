<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>João Paulo Lopes Dominguez | Currículo Online</title>
    <meta name="description" content="Currículo de João Paulo Lopes Dominguez — Instrutor de Pilotagem, Motorista e Vigilante com ampla experiência em Rio Branco, AC.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,700&family=Barlow+Condensed:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════════
           DESIGN TOKENS
        ═══════════════════════════════════════════════════════════ */
        :root {
            --bg:          #f5f2ed;
            --bg-2:        #ede9e0;
            --surface:     rgba(255,255,255,0.78);
            --surface-s:   rgba(255,255,255,0.92);
            --ink:         #111111;
            --ink-2:       #1a1a1a;
            --muted:       #444444;
            --line:        rgba(30,20,5,0.09);
            --line-s:      rgba(30,20,5,0.16);
            --accent:      #c8410a;
            --accent-gold: #e8a020;
            --accent-dark: #1a1008;
            --accent-soft: rgba(200,65,10,0.10);
            --radius-xl:   36px;
            --radius-lg:   26px;
            --radius-md:   18px;
            --shadow:      0 24px 60px rgba(30,15,0,0.14);
            --shadow-s:    0 10px 28px rgba(30,15,0,0.09);
            --max-width:   1220px;
            --dark-card-bg:  linear-gradient(135deg, #1a0d04 0%, #2d1508 55%, #3a1c0b 100%);
            --dark-card-txt: #f5ece0;
        }
        [data-theme="dark"] {
            --bg:          #0e0a06;
            --bg-2:        #160e07;
            --surface:     rgba(28,18,8,0.80);
            --surface-s:   rgba(35,22,10,0.93);
            --ink:         #f5ece0;
            --ink-2:       #f0e4d0;
            --muted:       #c8b090;
            --line:        rgba(240,220,180,0.07);
            --line-s:      rgba(240,220,180,0.13);
            --accent:      #e05015;
            --accent-gold: #f0b030;
            --accent-dark: #f5ece0;
            --accent-soft: rgba(224,80,21,0.15);
            --shadow:      0 24px 60px rgba(0,0,0,0.55);
            --shadow-s:    0 10px 28px rgba(0,0,0,0.38);
            --dark-card-bg:  linear-gradient(135deg, #050200 0%, #150800 55%, #1e0e03 100%);
            --dark-card-txt: #f5ece0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            font-family: "Barlow", sans-serif;
            font-weight: 400;
            color: var(--ink);
            background: var(--bg);
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* Mesh background */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(ellipse 65% 50% at 10% 5%, rgba(200,65,10,0.10) 0%, transparent 55%),
                radial-gradient(ellipse 55% 45% at 90% 8%, rgba(232,160,32,0.08) 0%, transparent 55%),
                radial-gradient(ellipse 50% 60% at 50% 100%, rgba(200,65,10,0.06) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
            transition: opacity 0.4s;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            background-size: 180px;
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }

        a { color: inherit; text-decoration: none; }
        img { max-width: 100%; display: block; }
        button { font: inherit; }

        /* ═══ PROGRESS BAR ═══ */
        .progress-bar {
            position: fixed;
            top: 0; left: 0;
            width: 0; height: 3px;
            z-index: 100;
            background: linear-gradient(90deg, var(--accent), var(--accent-gold), var(--accent));
            background-size: 200%;
            animation: gradShift 3s linear infinite;
            box-shadow: 0 0 10px rgba(200,65,10,0.5);
        }
        @keyframes gradShift { to { background-position: -200%; } }

        /* ═══ FLOATING ORBS ═══ */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.28;
        }
        .orb-a { width: 380px; height: 380px; top: -130px; right: -80px; background: var(--accent); animation: drift 15s ease-in-out infinite; }
        .orb-b { width: 300px; height: 300px; bottom: 8%; left: -100px; background: var(--accent-gold); animation: drift 12s ease-in-out infinite reverse; }
        .orb-c { width: 220px; height: 220px; top: 40%; left: 45%; background: var(--accent); animation: drift 18s ease-in-out infinite; opacity: 0.18; }
        @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(28px,-34px); } }

        /* ═══ SHELL ═══ */
        .shell {
            position: relative;
            z-index: 1;
            width: min(calc(100% - 40px), var(--max-width));
            margin: 0 auto;
        }

        /* ═══ TOP BAR ═══ */
        .topbar {
            position: sticky;
            top: 16px;
            z-index: 50;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px 10px 10px;
            border-radius: 999px;
            background: linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0.06));
            border: 1px solid rgba(255,255,255,0.11);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            box-shadow: 0 18px 38px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.16);
            transition: all 0.35s ease;
        }
        [data-theme="light"] .topbar {
            background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(255,255,255,0.65));
            border-color: rgba(0,0,0,0.06);
        }
        .topbar.scrolled { transform: translateY(2px) scale(0.985); box-shadow: 0 10px 26px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.16); }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
            cursor: pointer;
        }
        .brand-mark {
            width: 44px; height: 44px;
            border-radius: 50%;
            overflow: hidden;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-gold));
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 4px 10px rgba(200,65,10,0.4);
            flex-shrink: 0;
            position: relative;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
            cursor: pointer;
        }
        .brand-mark::after {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
        }
        .brand-mark:hover { transform: scale(1.08); }
        .brand-mark:hover::after { opacity: 0.5; transform: scale(1.05); }
        .brand-mark img { width: 100%; height: 100%; object-fit: cover; }

        .brand-copy { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
        .brand-name {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            letter-spacing: 0.02em;
            font-size: 1.02rem;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }
        .brand-role {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .nav { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); }
        [data-theme="light"] .nav { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.05); }

        .nav-link {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.66rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            padding: 9px 12px;
            border-radius: 999px;
            color: var(--muted);
            transition: all 0.22s ease;
            position: relative;
        }
        .nav-link:hover { color: var(--ink); background: rgba(200,65,10,0.08); }
        .nav-link.is-active { color: var(--ink); background: var(--accent-soft); }

        .topbar-actions { display: flex; align-items: center; gap: 8px; }

        .theme-toggle {
            position: relative;
            width: 52px; height: 30px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(255,255,255,0.07);
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s;
            padding: 0;
        }
        .theme-toggle-thumb {
            position: absolute;
            top: 3px; left: 3px;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-gold));
            box-shadow: 0 2px 8px rgba(200,65,10,0.5);
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        [data-theme="light"] .theme-toggle-thumb { transform: translateX(22px); background: linear-gradient(135deg, #2a2a2a, #555); }

        /* ═══ BUTTONS ═══ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.66rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 600;
            padding: 11px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            border: none;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #d8651f);
            color: #fff;
            box-shadow: 0 8px 22px rgba(200,65,10,0.32), inset 0 1px 0 rgba(255,255,255,0.18);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(200,65,10,0.4), inset 0 1px 0 rgba(255,255,255,0.22); }
        .btn-ghost {
            background: rgba(255,255,255,0.06);
            color: var(--ink);
            border: 1px solid rgba(255,255,255,0.12);
        }
        [data-theme="light"] .btn-ghost { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); }
        .btn-ghost:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

        /* ═══ HERO ═══ */
        .hero {
            padding-top: 70px;
            padding-bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 920px;
        }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.66rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            padding: 7px 14px;
            border: 1px solid rgba(200,65,10,0.35);
            background: var(--accent-soft);
            border-radius: 999px;
            width: fit-content;
        }
        .eyebrow::before {
            content: "";
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50%     { opacity: 0.5; transform: scale(1.3); }
        }

        .hero-title {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 900;
            font-size: clamp(3.4rem, 9vw, 7rem);
            line-height: 0.88;
            letter-spacing: -0.03em;
            color: var(--ink);
            text-transform: uppercase;
        }
        .hero-title .word-red {
            color: var(--accent);
            position: relative;
            display: inline-block;
        }
        .hero-title .word-red::after {
            content: "";
            position: absolute;
            bottom: 4%;
            left: 0;
            width: 100%;
            height: 18%;
            background: var(--accent);
            opacity: 0.18;
            z-index: -1;
            transform: skew(-8deg);
        }
        .hero-subtitle {
            font-family: "Barlow", sans-serif;
            font-weight: 500;
            font-size: clamp(1.05rem, 1.6vw, 1.3rem);
            color: var(--ink-2);
            line-height: 1.4;
            max-width: 760px;
        }
        .hero-summary {
            font-size: 1rem;
            line-height: 1.65;
            color: var(--muted);
            max-width: 700px;
        }

        .chip-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
        .chip {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.66rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            padding: 7px 13px;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--ink-2);
            transition: all 0.25s ease;
        }
        [data-theme="light"] .chip { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.07); }
        .chip:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

        .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }

        /* ═══ META STRIP ═══ */
        .meta-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin: 24px 0 4px 0;
        }
        .meta-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .meta-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .meta-label {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.62rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .meta-value { font-size: 0.97rem; font-weight: 500; color: var(--ink-2); line-height: 1.4; }

        /* ═══ SECTION ═══ */
        .section { padding-top: 72px; position: relative; }
        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 28px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .section-accent {
            width: 36px; height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-gold));
            border-radius: 999px;
            margin-bottom: 12px;
        }
        .section-kicker {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.66rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .section-title {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 800;
            font-size: clamp(2.2rem, 4.5vw, 3.6rem);
            line-height: 1;
            letter-spacing: -0.02em;
            color: var(--ink);
            margin-top: 4px;
            text-transform: uppercase;
        }
        .section-sub { color: var(--muted); max-width: 480px; line-height: 1.55; font-size: 0.95rem; }

        /* ═══ STATS ═══ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-top: 28px;
        }
        .stat-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 26px 22px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .stat-card::before {
            content: "";
            position: absolute;
            top: -1px; left: -1px;
            width: 0; height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-gold));
            transition: width 0.5s ease;
        }
        .stat-card:hover { transform: translateY(-4px); border-color: var(--line-s); }
        .stat-card:hover::before { width: 100%; }
        .stat-value {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 900;
            font-size: clamp(2.4rem, 4vw, 3.2rem);
            line-height: 1;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .stat-label {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ═══ CAP GRID ═══ */
        .cap-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
        .cap-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 26px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .cap-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(200,65,10,0.08), transparent 60%);
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }
        .cap-card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .cap-card:hover::before { opacity: 1; }
        .cap-kicker {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.62rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
            position: relative;
        }
        .cap-card h3 {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: var(--ink);
            line-height: 1.15;
            text-transform: uppercase;
            letter-spacing: 0.01em;
            position: relative;
        }
        .cap-card p { color: var(--muted); line-height: 1.6; font-size: 0.92rem; position: relative; }
        .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; position: relative; }
        .tag {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.6rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            padding: 5px 10px;
            border-radius: 6px;
            background: var(--accent-soft);
            color: var(--accent);
        }

        /* ═══ EXP CARDS ═══ */
        .exp-grid { display: grid; gap: 14px; }
        .exp-card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .exp-card::before {
            content: "";
            position: absolute;
            left: 0; top: 0;
            width: 3px; height: 0;
            background: linear-gradient(180deg, var(--accent), var(--accent-gold));
            transition: height 0.4s ease;
        }
        .exp-card:hover { transform: translateX(4px); border-color: var(--line-s); }
        .exp-card:hover::before { height: 100%; }
        .exp-body { flex: 1; min-width: 0; }
        .exp-company {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 800;
            font-size: 1.45rem;
            color: var(--ink);
            line-height: 1.1;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.01em;
        }
        .exp-title { font-size: 1rem; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
        .exp-meta {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.66rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .exp-badge {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.6rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding: 5px 11px;
            border-radius: 999px;
            border: 1px solid var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
            white-space: nowrap;
            flex-shrink: 0;
            align-self: flex-start;
        }

        /* ═══ COURSE SLIDER ═══ */
        .panel {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            padding: 28px;
        }
        .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
        .panel-head h3 {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.45rem;
            color: var(--ink);
            text-transform: uppercase;
        }
        .course-slider { position: relative; }
        .course-viewport { overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 14px; scrollbar-width: none; }
        .course-viewport::-webkit-scrollbar { display: none; }
        .course-list { display: flex; gap: 14px; }
        .course-card {
            flex: 0 0 320px;
            scroll-snap-align: start;
            background: var(--dark-card-bg);
            color: var(--dark-card-txt);
            border-radius: var(--radius-lg);
            padding: 22px 24px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .course-card::after {
            content: "";
            position: absolute;
            top: -50%; right: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(232,160,32,0.12), transparent 50%);
            pointer-events: none;
        }
        .course-card:hover { transform: translateY(-4px); }
        .course-num {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.62rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent-gold);
            position: relative;
        }
        .course-card strong {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            line-height: 1.15;
            position: relative;
        }
        .course-card p { font-size: 0.85rem; line-height: 1.55; opacity: 0.78; position: relative; }
        .course-nav {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            display: grid;
            place-items: center;
            box-shadow: 0 6px 16px rgba(200,65,10,0.35);
            transition: all 0.2s;
            z-index: 2;
        }
        .course-nav:hover { transform: translateY(-50%) scale(1.1); }
        .course-nav:disabled { opacity: 0.3; cursor: not-allowed; }
        .course-nav--prev { left: -16px; }
        .course-nav--next { right: -16px; }
        .course-prog { height: 3px; background: var(--line); border-radius: 999px; margin-top: 6px; overflow: hidden; }
        .course-prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-gold)); width: 0%; transition: width 0.3s ease; border-radius: 999px; }

        /* ═══ SKILLS ═══ */
        .skills-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
        .skills-panel {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            padding: 28px;
        }
        .skills-panel-head { margin-bottom: 18px; }
        .skills-panel-head h3 {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.45rem;
            color: var(--ink);
            text-transform: uppercase;
        }
        .skills-grid-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
        .skill-group-title {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.66rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .skill-pills { display: flex; flex-wrap: wrap; gap: 6px; }
        .skill-pill {
            font-size: 0.83rem;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--ink-2);
            transition: all 0.2s ease;
        }
        [data-theme="light"] .skill-pill { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.07); }
        .skill-pill:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

        .focus-panel { display: grid; gap: 16px; }
        .focus-card {
            background: var(--dark-card-bg);
            color: var(--dark-card-txt);
            border-radius: var(--radius-xl);
            padding: 26px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .focus-card::after {
            content: "";
            position: absolute;
            top: 0; right: 0;
            width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(232,160,32,0.15), transparent 70%);
            pointer-events: none;
        }
        .focus-card .section-kicker { color: var(--accent-gold); position: relative; }
        .focus-card h3 {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            margin: 4px 0 10px 0;
            text-transform: uppercase;
            position: relative;
        }
        .focus-card p { opacity: 0.78; margin-bottom: 18px; font-size: 0.88rem; line-height: 1.5; position: relative; }
        .focus-bars { display: grid; gap: 14px; position: relative; }
        .focus-head {
            display: flex;
            justify-content: space-between;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.66rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            margin-bottom: 6px;
            opacity: 0.85;
        }
        .focus-track { height: 6px; background: rgba(255,255,255,0.07); border-radius: 999px; overflow: hidden; }
        .focus-fill {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-gold));
            border-radius: 999px;
            width: 0%;
            transition: width 1.6s cubic-bezier(0.22,1,0.36,1);
        }

        /* ═══ EXTRAS ═══ */
        .extras-list { display: grid; gap: 10px; }
        .extra-item {
            padding: 16px 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius-md);
            color: var(--ink-2);
            font-size: 0.93rem;
            line-height: 1.5;
            position: relative;
            padding-left: 38px;
            transition: all 0.25s ease;
        }
        [data-theme="light"] .extra-item { background: rgba(0,0,0,0.02); border-color: rgba(0,0,0,0.05); }
        .extra-item::before {
            content: "";
            position: absolute;
            left: 18px; top: 50%;
            transform: translateY(-50%);
            width: 8px; height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-gold));
            box-shadow: 0 0 8px rgba(200,65,10,0.5);
        }
        .extra-item:hover { transform: translateX(4px); border-color: var(--accent); }

        /* ═══ CONTACT CARD ═══ */
        .contact-card {
            background: var(--dark-card-bg);
            color: var(--dark-card-txt);
            border-radius: var(--radius-xl);
            padding: 40px;
            margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.07);
            position: relative;
            overflow: hidden;
        }
        .contact-card::before {
            content: "";
            position: absolute;
            top: -50%; left: -10%;
            width: 70%; height: 200%;
            background: radial-gradient(circle, rgba(232,160,32,0.10), transparent 60%);
            pointer-events: none;
        }
        .contact-inner { display: grid; grid-template-columns: 2fr 1fr; gap: 36px; position: relative; }
        .contact-copy { margin-bottom: 22px; }
        .contact-card h2 {
            font-family: "Barlow Condensed", sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: -0.01em;
        }
        .contact-card p { opacity: 0.78; line-height: 1.55; font-size: 0.95rem; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .contact-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-md);
            padding: 18px 20px;
            transition: all 0.3s ease;
            display: block;
            text-decoration: none;
            color: inherit;
        }
        .contact-item:hover { background: rgba(255,255,255,0.09); border-color: var(--accent); transform: translateY(-3px); }
        .contact-label {
            display: block;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.6rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 6px;
        }
        .contact-item strong { display: block; font-size: 0.95rem; margin-bottom: 4px; font-weight: 600; }
        .contact-item p { font-size: 0.82rem; }
        .contact-side { display: grid; gap: 14px; align-content: start; }
        .contact-panel {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: var(--radius-md);
            padding: 20px;
        }
        .contact-panel h3 {
            font-family: "JetBrains Mono", monospace;
            font-size: 0.66rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        /* ═══ FOOTER ═══ */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 50px 20px 28px 20px;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.66rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ═══ SCROLL TOP ═══ */
        .scroll-top {
            position: fixed;
            bottom: 24px; right: 24px;
            z-index: 60;
            width: 46px; height: 46px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: var(--accent);
            color: #fff;
            font-size: 1.2rem;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 24px rgba(200,65,10,0.45);
        }
        .scroll-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        .scroll-top:hover { transform: translateY(-3px) scale(1.06); }

        /* ═══ MODAL ═══ */
        .img-modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: modalFade 0.25s ease;
        }
        .img-modal.open { display: flex; }
        @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
        .img-modal img {
            max-width: 90vw;
            max-height: 88vh;
            border-radius: 14px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.55);
            animation: modalScale 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes modalScale { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .img-modal-close {
            position: absolute;
            top: 18px; right: 18px;
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1.4rem;
            cursor: pointer;
        }

        /* ═══ REVEAL ═══ */
        .reveal {
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.7s cubic-bezier(0.22,1,0.36,1), transform 0.7s cubic-bezier(0.22,1,0.36,1);
            will-change: opacity, transform;
        }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        .reveal-delay-1 { transition-delay: 0.08s; }
        .reveal-delay-2 { transition-delay: 0.16s; }
        .reveal-delay-3 { transition-delay: 0.24s; }
        .reveal-delay-4 { transition-delay: 0.32s; }

        /* ═══════════════════════════════════════════════════════════
           INTRO OVERLAY  (FIXED - sem delay)
        ═══════════════════════════════════════════════════════════ */
        #intro-overlay {
            position: fixed; inset: 0;
            z-index: 99999;
            background: radial-gradient(ellipse at 40% 50%, #1a0d04 0%, #0a0500 55%, #050200 100%);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        #intro-overlay::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
            background-size: 200px;
            opacity: 0.6;
            pointer-events: none;
        }
        #intro-overlay::after {
            content: "";
            position: absolute;
            inset: -20%;
            background:
                radial-gradient(circle 400px at 20% 30%, rgba(200,65,10,0.18), transparent),
                radial-gradient(circle 350px at 80% 70%, rgba(232,160,32,0.12), transparent);
            pointer-events: none;
            animation: introBgDrift 8s ease-in-out infinite alternate;
        }
        @keyframes introBgDrift {
            0%   { transform: translate(0,0); }
            100% { transform: translate(20px,-20px); }
        }
        #intro-overlay.intro-exit {
            animation: introWipe 0.85s cubic-bezier(0.76,0,0.24,1) forwards;
            pointer-events: none;
        }
        @keyframes introWipe {
            0%   { clip-path: inset(0 0 0 0); opacity: 1; }
            60%  { opacity: 1; }
            100% { clip-path: inset(100% 0 0 0); opacity: 0; }
        }

        .intro-content {
            position: relative; z-index: 2;
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 820px; padding: 0 24px; gap: 0;
        }
        .intro-pre {
            font-family: "JetBrains Mono", monospace;
            font-size: clamp(0.6rem, 1.1vw, 0.74rem);
            letter-spacing: 0.34em;
            text-transform: uppercase;
            color: rgba(232,160,32,0.65);
            margin-bottom: 22px;
            opacity: 0;
            animation: introFadeIn 0.6s ease 0.05s forwards;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .intro-pre::before, .intro-pre::after {
            content: "";
            width: 30px; height: 1px;
            background: rgba(232,160,32,0.5);
        }
        .intro-bigname {
            font-family: "Barlow Condensed", sans-serif;
            font-size: clamp(3.5rem, 13vw, 8.5rem);
            font-weight: 900;
            line-height: 0.85;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            text-align: center;
            color: #fff;
            opacity: 0;
            transform: scale(0.94) translateY(14px);
            animation: introNameIn 0.65s cubic-bezier(0.22,1,0.36,1) 0.15s forwards;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #ffffff 0%, #f0e4d0 50%, #ffffff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @keyframes introNameIn {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes introFadeIn { to { opacity: 1; } }

        .name-glitch { position: relative; display: inline-block; }
        .name-glitch::before,.name-glitch::after {
            content:attr(data-text);
            position:absolute;
            top:0;left:0;width:100%;height:100%;
            opacity:0;
            -webkit-text-fill-color: initial;
            background: none;
        }
        .intro-bigname.glitching .name-glitch::before {
            opacity:0.75;
            color:#ff6020;
            clip-path:polygon(0 22%,100% 22%,100% 42%,0 42%);
            transform:translateX(-5px);
            animation:glA 0.12s steps(2) infinite;
        }
        .intro-bigname.glitching .name-glitch::after {
            opacity:0.75;
            color:#ffd060;
            clip-path:polygon(0 62%,100% 62%,100% 78%,0 78%);
            transform:translateX(5px);
            animation:glB 0.12s steps(2) infinite 0.05s;
        }
        @keyframes glA {
            0%   { clip-path:polygon(0 22%,100% 22%,100% 42%,0 42%); transform:translateX(-5px); }
            50%  { clip-path:polygon(0 52%,100% 52%,100% 70%,0 70%); transform:translateX(5px); }
        }
        @keyframes glB {
            0%   { clip-path:polygon(0 62%,100% 62%,100% 78%,0 78%); transform:translateX(5px); }
            50%  { clip-path:polygon(0 15%,100% 15%,100% 32%,0 32%); transform:translateX(-5px); }
        }

        .intro-tagline {
            font-family: "JetBrains Mono", monospace;
            font-size: clamp(0.6rem, 1.2vw, 0.74rem);
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: rgba(224,80,21,0.85);
            text-align: center;
            opacity: 0;
            animation: introFadeIn 0.7s ease 0.55s forwards;
        }

        .intro-progress {
            margin-top: 36px;
            width: min(280px, 60vw);
            height: 2px;
            background: rgba(255,255,255,0.07);
            border-radius: 999px;
            overflow: hidden;
            opacity: 0;
            animation: introFadeIn 0.5s ease 0.65s forwards;
        }
        .intro-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-gold));
            width: 0%;
            border-radius: 999px;
            animation: introProg 1.7s cubic-bezier(0.65,0,0.35,1) 0.7s forwards;
        }
        @keyframes introProg { to { width: 100%; } }

        .intro-skip-btn {
            position: absolute; bottom: 22px; right: 22px; z-index: 10;
            font-family: "JetBrains Mono", monospace;
            font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
            color: rgba(232,160,32,0.55); background: transparent;
            border: 1px solid rgba(232,160,32,0.32); border-radius: 6px;
            padding: 8px 16px; cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0;
            animation: introFadeIn 0.5s ease 0.4s forwards;
        }
        .intro-skip-btn:hover {
            color: rgba(232,160,32,1);
            border-color: rgba(232,160,32,0.85);
            background: rgba(232,160,32,0.08);
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 1100px) {
            .nav { display: none; }
            .cap-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
        }
        @media (max-width: 860px) {
            .shell { width: min(calc(100% - 24px), var(--max-width)); }
            .topbar { position: static; margin-top: 12px; flex-direction: row; flex-wrap: wrap; align-items: center; border-radius: 24px; padding: 10px 12px; gap: 8px; }
            .brand { flex: 1 1 auto; min-width: 0; }
            .topbar-actions { flex-wrap: wrap; width: 100%; justify-content: stretch; gap: 8px; }
            .topbar-actions .btn { flex: 1 1 0; justify-content: center; }
            .topbar-actions .theme-toggle { flex-shrink: 0; margin-left: auto; }
            .meta-strip, .stats-grid { grid-template-columns: 1fr 1fr; }
            .skills-layout, .contact-inner { grid-template-columns: 1fr; }
            .cap-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
            .hero-actions { width: 100%; }
        }
        @media (max-width: 600px) {
            .hero { padding-top: 40px; gap: 20px; }
            .hero-title { max-width: none; font-size: clamp(3rem, 14vw, 5rem); }
            .meta-strip, .stats-grid, .cap-grid, .contact-grid, .skills-grid-inner { grid-template-columns: 1fr; }
            .course-card { flex-basis: 86%; }
            .section-head { flex-direction: column; align-items: flex-start; }
            .hero-actions, .contact-actions { flex-direction: column; align-items: stretch; }
            .hero-actions .btn, .contact-actions .btn, .topbar-actions .btn { width: 100%; justify-content: center; }
            .section { padding-top: 52px; }
            .contact-card { padding: 28px 22px; }
            .panel { padding: 22px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .reveal { opacity: 1; transform: none; }
        }
    </style>
</head>
